<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b101b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SQL Quest" />
  <meta name="description" content="Entrenador móvil estilo Duolingo + RPG para dominar SQL Nivel 2 (60 horas) enfocado en Operations & Manufacturing BI." />

  <title>SQL Quest RPG · Rumbo al Nivel 2 (60h)</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Sticky Top RPG HUD -->
  <header class="top-hud">
    <div class="top-hud-inner" id="top-hud"></div>
  </header>

  <!-- Main Tab Container -->
  <div class="app-shell">
    <main class="main-view" id="main-view"></main>
  </div>

  <!-- Thumb-Friendly Bottom Tab Bar -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <div class="bottom-nav-inner" id="bottom-nav"></div>
  </nav>

  <!-- Fullscreen Duolingo-Style Lesson Runner Overlay -->
  <section class="lesson-overlay hidden" id="lesson-overlay" aria-live="polite">
    <div class="lesson-top" id="lesson-top"></div>
    <div class="lesson-body" id="lesson-body"></div>
    <div class="lesson-footer" id="lesson-footer">
      <div class="lesson-footer-inner" id="lesson-footer-inner"></div>
    </div>
  </section>

  <!-- Generic Modal (Node Launch, Schema Explorer, Victory, Placement Test) -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-panel" id="modal-panel"></div>
  </div>

  <!-- Core Scripts (Zero build step needed for Vercel) -->
  <script src="./js/rpg-state.js"></script>
  <script src="./js/db-engine.js"></script>
  <script src="./js/curriculum-part1.js"></script>
  <script src="./js/curriculum-part2.js"></script>
  <script src="./js/generator.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
