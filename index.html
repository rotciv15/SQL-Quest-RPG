      `;
      return;
    }

    if (sess.idx >= total) {
      renderSessionVictory();
      return;
    }

    const ex = sess.queue[sess.idx];
    const modeBadges = {
      quiz: '🧠 Decisión Arquitectónica',
      fill: '🧩 Completa la Expresión',
      bug: '🐛 Caza el Bug / Trampa',
      build: '🧱 Ordena la Arquitectura',
      tokens: isDaxTrack() ? '⌨️ Constructor Táctil DAX / M' : '⌨️ Constructor Táctil SQL'
    };

    let skeletonHTML = '';
    if (isDaxTrack()) {
      const daxStages = [
        { k: 'INGESTA', label: 'Power Query' },
        { k: 'MODELO', label: 'Star Schema' },
        { k: 'ROW_CTX', label: 'Row Ctx' },
        { k: 'FILTER_CTX', label: 'Filter Ctx' },
        { k: 'CALCULATE', label: 'CALCULATE' },
        { k: 'TIME', label: 'Time Intel' },
        { k: 'RLS', label: 'RLS / Fabric' }
      ];
      const activeStages = ex.clauses || ['FILTER_CTX'];
      skeletonHTML = `
        <div class="skeleton-bar mono">
          <span style="font-family:sans-serif; color:var(--text-muted); font-weight:700;">Capas:</span>
          ${daxStages.map(st => `<span class="sk-pill ${activeStages.includes(st.k) ? 'active' : ''}">${st.label}</span>`).join('<span style="opacity:0.25">→</span>')}
        </div>
      `;
    } else {
      const allClauses = ['WITH', 'SELECT', 'FROM', 'JOIN', 'WHERE', 'GROUP', 'HAVING', 'ORDER'];
      const activeClauses = ex.clauses || ['SELECT', 'FROM'];
      skeletonHTML = `
        <div class="skeleton-bar mono">
          <span style="font-family:sans-serif; color:var(--text-muted); font-weight:700;">Orden:</span>
          ${allClauses.map(cl => `<span class="sk-pill ${activeClauses.includes(cl) ? 'active' : ''}">${cl === 'GROUP' ? 'GROUP BY' : cl === 'ORDER' ? 'ORDER BY' : cl}</span>`).join('<span style="opacity:0.25">→</span>')}
        </div>
      `;
    }

    let workspaceHTML = '';
    if (ex.mode === 'quiz') {
      workspaceHTML = `
        ${ex.code ? `<pre class="sql-box mono">${highlightSQL(ex.code)}</pre>` : ''}
        <div style="display:grid; gap:8px;">
          ${ex.options.map((opt, idx) => {
            let cls = '';
            if (sess.answeredState) {
              if (opt.ok) cls = 'correct-choice';
              else if (ex.pickedIdx === idx) cls = 'wrong-choice';
            } else if (ex.pickedIdx === idx) {
              cls = 'picked';
            }
            return `
              <button class="option-card ${cls}" ${sess.answeredState ? 'disabled' : ''} onclick="App.pickOption(${idx})">
                <span class="mono" style="font-weight:800; color:var(--text-muted);">${idx + 1}.</span>
                <span>${esc(opt.text)}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    } else if (ex.mode === 'fill') {
      const chosenText = ex.pickedIdx !== null ? ex.options[ex.pickedIdx].text : ' ? ';
      const codeLines = ex.template.map(line => {
        const parts = line.split('[HUECO]');
        if (parts.length === 1) return highlightSQL(line);
        return parts.map(p => highlightSQL(p)).join(`<span style="padding:2px 8px; border-radius:7px; background:var(--cyan-bg); border:1.5px solid var(--cyan); color:#38bdf8; font-weight:800;">${esc(chosenText)}</span>`);
      }).join('\n');

      workspaceHTML = `
        <pre class="sql-box mono">${codeLines}</pre>
        <div style="display:grid; gap:8px;">
          ${ex.options.map((opt, idx) => {
            let cls = '';
            if (sess.answeredState) {
              if (opt.ok) cls = 'correct-choice';
              else if (ex.pickedIdx === idx) cls = 'wrong-choice';

              <button class="option-card mono ${cls}" style="font-size:12.5px;" ${sess.answeredState ? 'disabled' : ''} onclick="App.pickOption(${idx})">
                <span>${esc(opt.text)}</span>
              </button>

        </div>
      `;
    } else if (ex.mode === 'bug') {
      workspaceHTML = `
        <div style="font-size:12px; color:var(--text-muted);">👆 Toca el renglón exacto que contiene el error o antipatrón:</div>
        <div style="display:grid; gap:7px;">
          ${ex.lines.map((line, idx) => {
            let cls = '';
            if (sess.answeredState) {
              if (idx === ex.bugIndex) cls = 'correct-choice';
              else if (ex.pickedIdx === idx) cls = 'wrong-choice';
            } else if (ex.pickedIdx === idx) {

            return `
              <button class="option-card mono ${cls}" style="font-size:12.5px;" ${sess.answeredState ? 'disabled' : ''} onclick="App.pickOption(${idx})">
                <span style="color:var(--text-muted); user-select:none;">${idx + 1}</span>
                <span style="overflow-x:auto;">${highlightSQL(line)}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    } else if (ex.mode === 'build' || ex.mode === 'tokens') {
      const usedIds = new Set(ex.selected.map(x => x.id));
      const isLineMode = ex.mode === 'build';

      workspaceHTML = `
        <div class="row-between" style="font-size:12px; color:var(--text-muted);">
          <span>Tu solución (toca una pieza puesta para quitarla):</span>
          ${!sess.answeredState && ex.selected.length > 0 ? `<button class="quick-key" style="font-size:11px;" onclick="App.clearSelectedTokens()">Limpiar</button>` : ''}
        </div>

  function checkCurrentExercise() {
    const sess = ui.session;
    if (!sess || sess.answeredState) return;
    const ex = sess.queue[sess.idx];
    const defaultSk = isDaxTrack() ? 'CTX' : 'EXT';

    let isOk = false;
    let feedbackWhy = '';
    let canonicalSql = ex.answerSql || '';

    if (ex.mode === 'quiz') {
      const opt = ex.options[ex.pickedIdx];
      isOk = !!opt.ok;
      feedbackWhy = opt.why;
    } else if (ex.mode === 'fill') {
      const opt = ex.options[ex.pickedIdx];
      isOk = !!opt.ok;
      feedbackWhy = opt.why;
      const rightOpt = ex.options.find(o => o.ok);
      canonicalSql = ex.template.map(l => l.replace('[HUECO]', rightOpt ? rightOpt.text : '')).join('\n');
    } else if (ex.mode === 'bug') {
      isOk = ex.pickedIdx === ex.bugIndex;
      feedbackWhy = isOk ? ex.whyOk : ex.whyWrong;
      canonicalSql = ex.fixedSql;
    } else if (ex.mode === 'build') {
      const chosen = ex.selected.map(x => x.text);
      canonicalSql = ex.answer.join('\n');
      isOk = chosen.length === ex.answer.length && chosen.every((t, i) => t === ex.answer[i]);
      if (isOk) {
        feedbackWhy = ex.why;
      } else {
        const trap = chosen.find(t => !ex.answer.includes(t));
        if (trap) feedbackWhy = `Incluiste un bloque trampa ("${trap}"). Mira la secuencia correcta abajo:`;
        else if (chosen.length < ex.answer.length) feedbackWhy = `Faltaron bloques (${chosen.length} de ${ex.answer.length}).`;
        else feedbackWhy = 'Elegiste piezas válidas pero en un orden distinto al requerido.';
      }
    } else if (ex.mode === 'tokens') {
      const norm = arr => arr.join(' ').replace(/\s+/g, ' ').trim();
      const userStr = norm(ex.selected.map(x => x.text));
      const targetStr = norm(ex.tokens);
      canonicalSql = targetStr;
      isOk = userStr === targetStr;
      if (isOk) {
        feedbackWhy = ex.why;
      } else {
        const trap = ex.selected.map(x => x.text).find(t => !ex.tokens.includes(t));
        if (trap) feedbackWhy = `Usaste el bloque trampa "${trap}". Revisa la expresión exacta:`;
        else feedbackWhy = 'Casi lo tienes: revisa el orden o si te faltó algún bloque.';
      }
    }

    RPG.recordActivityMinutes(0.4);

    if (isOk) {
      if (!ex._retriedOnce) sess.firstTryCorrect = (sess.firstTryCorrect || 0) + 1;
      sess.combo += 1;
      const res = RPG.awardExerciseProgress({
        baseXP: sess.isBoss ? 22 : 15,
        skill: ex.skill || defaultSk,
        combo: sess.combo
      });
      sess.earnedXP += res.gainedXP;
      if (sess.kind === 'srs' && ex._srsId) {
        RPG.resolveMistake(ex._srsId);
      }
      if (sess.kind === 'dungeon') {
        RPG.state.dungeonSolvedCount = (RPG.state.dungeonSolvedCount || 0) + 1;
        if (RPG.state.hearts < RPG.state.maxHearts && sess.combo % 2 === 0) {
          RPG.state.hearts += 1;
        }
        RPG.unlockNewAchievements();
        RPG.saveState();
      }
      RPG.playSfx('correct');
      sess.answeredState = {
        ok: true,
        title: `¡Excelente! (+${res.gainedXP} XP${res.boostMult > 1 ? ' · 2x!' : ''})`,
        body: feedbackWhy,
        sqlPreview: ex.mode === 'bug' ? canonicalSql : null
      };
    } else {
      sess.combo = 0;
      sess.mistakesInRun += 1;
      const snap = JSON.parse(JSON.stringify(ex));
      delete snap.pool;
      delete snap.selected;
      delete snap.pickedIdx;

      // En el simulacro PL-300 no restamos vidas para que termine el examen completo y obtenga puntaje /1000
      const prevZen = RPG.state.zenMode;
      if (sess.kind === 'pl300_mock') RPG.state.zenMode = true;
      RPG.registerMistake({
        id: `${sess.nodeId || sess.kind}_${sess.idx}_${ex.prompt.slice(0, 24)}`,
        worldId: ex.worldId || sess.worldId || 1,
        skill: ex.skill || defaultSk,
        prompt: ex.prompt,
        answerSql: canonicalSql,
        why: feedbackWhy,
        exerciseSnapshot: snap
      });
      if (sess.kind === 'pl300_mock') RPG.state.zenMode = prevZen;

      if (!ex._retriedOnce && sess.kind !== 'pl300_mock') {
        const retryCopy = cloneExerciseForPlay(snap);
        retryCopy._retriedOnce = true;
        retryCopy.prompt = '🔁 [ Segunda oportunidad ] ' + retryCopy.prompt;
        sess.queue.push(retryCopy);
      }

      RPG.playSfx('wrong');
      sess.answeredState = {
        ok: false,
        title: 'Ajustemos este detalle:',
        body: feedbackWhy,
        sqlPreview: canonicalSql
      };
    }

    renderLessonStep();
  }

  // ==========================================================================
  // EJECUCIÓN CONSOLA SQL & LABORATORIO DAX
  // ==========================================================================
  function cellsMatch(a, b) {
    if (a === b) return true;
    if (a == null && b == null) return true;
    const na = Number(a);
    const nb = Number(b);
    if (!Number.isNaN(na) && !Number.isNaN(nb) && String(a).trim() !== '' && String(b).trim() !== '') {
      return Math.abs(na - nb) <= 0.06;
    }
    return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  }

  async function runConsoleQuery(shouldGrade = false) {
    ui.consoleRunning = true;
    ui.consoleError = null;
    ui.consoleGradeMsg = null;
    renderMainTab();

    try {
      RPG.recordActivityMinutes(0.5, 'sql');
      const userRes = await SQLDB.executeQuery(ui.consoleSql);
      ui.consoleResult = userRes;

      if (shouldGrade && ui.consoleChallengeId !== 'free') {
        const ch = (window.CONSOLE_CHALLENGES || []).find(c => c.id === ui.consoleChallengeId);
        if (ch) {
          const expected = await SQLDB.executeQuery(ch.solutionSql);
          const sameRows = userRes.rowCount === expected.rowCount;
          const sameCols = userRes.columns.length === expected.columns.length;
          let allCellsOk = sameRows && sameCols;

          if (allCellsOk) {
            for (let r = 0; r < expected.values.length; r++) {
              for (let c = 0; c < expected.columns.length; c++) {
                if (!cellsMatch(userRes.values[r][c], expected.values[r][c])) {
                  allCellsOk = false;
                  break;
                }
              }
              if (!allCellsOk) break;
            }
          }

          if (allCellsOk) {
            const firstTime = !RPG.state.consoleSolved.includes(ch.id);
            if (firstTime) {
              RPG.state.consoleSolved.push(ch.id);
              RPG.state.gems += 20;
            }
            const xpRes = RPG.awardExerciseProgress({ baseXP: firstTime ? 45 : 15, skill: ch.skill || 'VEN', combo: 2 });
            RPG.playSfx('victory');
            ui.consoleGradeMsg = {
              ok: true,
              title: `🏆 ¡Reto SQL Superado! (+${xpRes.gainedXP} XP${firstTime ? ' · +20 💎' : ''})`,
              body: 'Tu consulta devolvió exactamente los mismos datos que espera el Hiring Manager.'
            };
          } else {
            RPG.playSfx('wrong');
            ui.consoleGradeMsg = {
              ok: false,
              title: 'Aún no coincide con la tabla esperada:',
              body: `Tu consulta devolvió ${userRes.rowCount} fila(s) y ${userRes.columns.length} columna(s); se esperaban ${expected.rowCount} fila(s) y ${expected.columns.length} columna(s) en el orden solicitado.`
            };
          }
        }
      } else {
        RPG.playSfx('tap');
      }
    } catch (err) {
      RPG.playSfx('wrong');
      ui.consoleError = err.message || String(err);
    } finally {
      ui.consoleRunning = false;
      renderAll();
    }
  }

        slicers: ui.daxSlicers,

        if (ch) {

      ui.daxError = null;
      if (val !== 'free') {
        const ch = (window.DAX_LAB_CHALLENGES || []).find(c => c.id === val);
        if (ch) {
          ui.daxFormula = ch.starterDax;
          if (ch.defaultGroupBy) ui.daxGroupBy = ch.defaultGroupBy;
        }
      }
      renderMainTab();
    },
    loadDaxChallengeSolution() {
      const ch = (window.DAX_LAB_CHALLENGES || []).find(c => c.id === ui.daxChallengeId);
      if (ch) {
        ui.daxFormula = ch.solutionDax;
        runDaxEvaluation(false);
      }
    },
    updateDaxText(val) {
      ui.daxFormula = val;
    },
    insertDaxSnippet(snippet) {
      const ta = document.getElementById('dax-textarea');
      if (!ta) return;
      const start = ta.selectionStart ?? ui.daxFormula.length;
      const end = ta.selectionEnd ?? ui.daxFormula.length;
      ui.daxFormula = ui.daxFormula.slice(0, start) + snippet + ui.daxFormula.slice(end);
      ta.value = ui.daxFormula;
      ta.focus();
      const pos = start + snippet.length;
      ta.setSelectionRange(pos, pos);
    },
    setDaxSlicer(key, val) {
      ui.daxSlicers[key] = val;
      runDaxEvaluation(false);
    },
    setDaxGroupBy(val) {
      ui.daxGroupBy = val;
      runDaxEvaluation(false);
    },
    toggleDaxModelRef() {
      ui.daxModelOpen = !ui.daxModelOpen;
      renderMainTab();
    },
    runDaxEvaluation,

    // Shop, Settings & Cloud Sync
    buyShopItem(kind) {
      const s = RPG.state;
      if (kind === 'hearts') {
        if (s.gems < 30) return showSimpleModal('Faltan Gemas', 'Necesitas 30 💎. ¡Completa una lección para ganar más!');
        s.gems -= 30;
        s.hearts = s.maxHearts;
      } else if (kind === 'freeze') {
        if (s.gems < 50) return showSimpleModal('Faltan Gemas', 'Necesitas 50 💎.');
        s.gems -= 50;
        s.streakFreezes += 1;
      } else if (kind === 'boost') {
        if (s.gems < 45) return showSimpleModal('Faltan Gemas', 'Necesitas 45 💎.');
        s.gems -= 45;
        s.xpBoostUntil = Date.now() + 15 * 60000;
      }
      RPG.saveState();
      RPG.playSfx('levelup');
      renderAll();
    },
    setGrimoireFilter(cat) {
      ui.grimoireFilter = cat;
      renderMainTab();
    },
    toggleSetting(key, val) {
      RPG.state[key] = !!val;
      RPG.saveState();
      renderAll();
    },
    setDailyGoal(val) {
      RPG.state.dailyGoalMin = Number(val) || 30;
      RPG.saveState();
      renderAll();
    },
    copySaveCode() {
      const code = RPG.exportSaveCode();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => {
          showSimpleModal('✅ Código Unificado Copiado', 'Este código incluye tanto tu progreso de SQL (60h) como el de Power BI / DAX / PL-300 (55h).');
        });
      } else {
        prompt('Copia este código de respaldo:', code);
      }
    },
    promptRestoreCode() {
      const input = prompt('Pega aquí tu código de avance que empieza con SQLQ2:');
      if (!input) return;
      try {
        RPG.importSaveCode(input);
        RPG.playSfx('levelup');
        renderAll();
        showSimpleModal('🎉 ¡Academia Restaurada!', 'Tu progreso de SQL y DAX/PL-300 fue fusionado sin perder nada.');
      } catch (e) {
        showSimpleModal('Error de Código', e.message || 'El código no es válido.');
      }
    },
    confirmResetTrack() {
      const tMeta = RPG.currentTrackMeta;
      if (confirm(`¿Seguro que deseas reiniciar únicamente ${tMeta.name} a cero? (El otro reino se conservará intacto).`)) {
        RPG.resetCurrentTrack();
        renderAll();
        showSimpleModal('🔄 Reino Reiniciado', `${tMeta.name} volvió al Nivel 1.`);
      }
    },
    downloadAnkiTSV() {
      const tsv = RPG.exportMistakesAsAnkiTSV();
      const blob = new Blob([tsv], { type: 'text/tab-separated-values;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = isDaxTrack() ? 'dax_pl300_errores_anki.tsv' : 'sql_quest_errores_anki.tsv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    },

    openCloudSyncModal() {
      const currentPin = (RPG.getCloudPin ? RPG.getCloudPin() : '') || '';
      const lastSync = RPG.getLastSyncTime ? RPG.getLastSyncTime() : null;
      const lastSyncText = lastSync ? new Date(lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Sin sincronizar aún';

      openModalHTML(`
        <div style="text-align:center;">
          <div style="font-size:38px; margin-bottom:4px;">☁️</div>
          <div style="font-size:20px; font-weight:900; color:var(--text-main);">
            Nube Unificada (SQL + DAX/PL-300)
          </div>
          <p style="font-size:12.5px; color:var(--text-muted); line-height:1.45; margin:6px 0 14px;">
            Ambos reinos (60h SQL + 55h Power BI/DAX) se guardan en tu misma base de datos Upstash Redis bajo el mismo PIN para tu iPhone y PC.
          </p>

          <div style="background:var(--card-subtle); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:left; margin-bottom:12px;">
            <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:6px;">
              Tu PIN o Usuario Personal
            </label>
            <div style="display:flex; gap:8px;">
              <input id="cloud-pin-input" type="text" value="${esc(currentPin)}" placeholder="ej: victor" maxlength="24"
                style="flex:1; background:var(--bg-main); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:14px; font-weight:700; color:var(--text-main); outline:none;" />
              <button class="btn-3d btn-cyan" onclick="App.handleSetCloudPin()" style="padding:9px 12px; font-size:12px;">
                Guardar PIN
              </button>
            </div>
            <div id="cloud-sync-status-msg" style="font-size:11px; color:var(--text-muted); margin-top:8px;">
              ${currentPin ? `🟢 Conectado con PIN: <b>${esc(currentPin)}</b> · Última sync: ${lastSyncText}` : '⚪ Escribe tu PIN (ej: victor) para auto-sincronizar.'}
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
            <button class="btn-3d btn-green" onclick="App.handleCloudSyncUpload()" style="padding:11px 8px; font-size:12.5px; font-weight:800;">
              ⬆️ Subir a Nube
            </button>
            <button class="btn-3d btn-cyan" onclick="App.handleCloudSyncDownload()" style="padding:11px 8px; font-size:12.5px; font-weight:800;">
              ⬇️ Cargar de Nube
            </button>
          </div>

          <button class="btn-3d btn-secondary" onclick="App.closeModal()" style="width:100%; padding:10px;">
            Cerrar
          </button>
        </div>
      `);
    },
    async handleSetCloudPin() {
      const inp = document.getElementById('cloud-pin-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) {
        RPG.setCloudPin('');
        showSimpleModal('PIN Eliminado', 'Se desconectó la sincronización en la nube.');
        renderHUD();
        return;
      }
      RPG.setCloudPin(val);
      const msgEl = document.getElementById('cloud-sync-status-msg');
      if (msgEl) msgEl.innerHTML = `🟡 Conectando con PIN <b>${esc(val)}</b>...`;

      const downRes = await RPG.syncFromCloud(val, true);
      if (downRes.ok && downRes.found) {
        await RPG.syncToCloud(val, false);
        showSimpleModal('🎉 Sincronizado', `Se fusionó y respaldó tu avance de SQL y DAX/PL-300 para "${val}".`);
      } else {
        const upRes = await RPG.syncToCloud(val, true);
        if (upRes.ok) {
          showSimpleModal('☁️ Conectado y Guardado', `Ambos reinos quedaron respaldados en Upstash bajo "${val}".`);
        } else {
          showSimpleModal('PIN Guardado', `PIN "${val}" guardado localmente (${upRes.error || 'Verifica Upstash en Vercel'}).`);
        }
      }
      renderAll();
    },
    async handleCloudSyncUpload() {
      const pin = RPG.getCloudPin();
      if (!pin) return showSimpleModal('Falta PIN', 'Ingresa tu PIN (ej: victor) antes de subir.');
      const res = await RPG.syncToCloud(pin, true);
      if (res.ok) {
        showSimpleModal('☁️ Guardado en la Nube', `Tu avance de SQL y Power BI/DAX fue guardado bajo "${pin}".`);
      } else {
        showSimpleModal('Aviso de Servidor', res.error || 'Verifica la conexión con Upstash Redis en Vercel.');
      }
      renderHUD();
    },
    async handleCloudSyncDownload() {
      const pin = RPG.getCloudPin();
      if (!pin) return showSimpleModal('Falta PIN', 'Ingresa tu PIN para descargar tu avance.');
      const res = await RPG.syncFromCloud(pin, true);
      if (res.ok && res.found) {
        showSimpleModal('⬇️ Avance Descargado', '¡Éxito! Tus niveles, coronas y horas de ambos reinos están al día.');
      } else if (res.ok && !res.found) {
        showSimpleModal('Sin Datos', `Aún no hay respaldo en la nube para "${pin}". Presiona "Subir a Nube" primero.`);
      } else {
        showSimpleModal('Aviso de Servidor', res.error || 'Error al conectar con la nube.');
      }
      renderAll();
    },
    updateSyncBadge(status) {
      const el = document.getElementById('hud-sync-icon');
      const btn = el ? el.closest('.sync-pill') : null;
      if (!el || !btn) return;
      const pin = RPG.getCloudPin();
      btn.classList.remove('connected', 'syncing', 'error');

      if (status === 'syncing') {
        btn.classList.add('syncing');
        el.innerHTML = '🔄';
      } else if (status === 'connected') {
        btn.classList.add('connected');
        el.innerHTML = pin ? `☁️<span class="pin-label"> ${esc(pin)}</span>` : '☁️✓';
      } else if (status === 'error') {
        btn.classList.add('error');
        el.innerHTML = '☁️⚠️';
      } else {
        el.innerHTML = pin ? `☁️<span class="pin-label"> ${esc(pin)}</span>` : '☁️';
      }
    }
  };

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const savedPin = (RPG.getCloudPin ? RPG.getCloudPin() : '') || '';
  if (savedPin && RPG.syncFromCloud) {
    RPG.syncFromCloud(savedPin, false).then(res => {
      if (res && res.ok && res.found) renderAll();
    }).catch(() => {});
  }

  renderAll();
})();

  </script>
</body>
</html>
